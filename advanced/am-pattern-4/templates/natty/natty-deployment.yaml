apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "am-pattern-4.resource.prefix" . }}-natty-deployment
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.wso2.deployment.natty.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: {{ .Values.wso2.deployment.natty.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.wso2.deployment.natty.strategy.rollingUpdate.maxUnavailable }}
    type: RollingUpdate
  selector:
    matchLabels:
      deployment: {{ template "am-pattern-4.resource.prefix" . }}-natty
      app: natty
  template:
    metadata:
      labels:
        deployment: {{ template "am-pattern-4.resource.prefix" . }}-natty
        app: natty
    spec:
      containers:
      - name: natty
        image: "{{ .Values.wso2.deployment.natty.imageName }}:{{ .Values.wso2.deployment.natty.imageTag }}"
        imagePullPolicy: {{ .Values.wso2.deployment.natty.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.wso2.deployment.natty.service.targetPort }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: {{ .Values.wso2.deployment.natty.startupProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.wso2.deployment.natty.startupProbe.periodSeconds }}
          failureThreshold: {{ .Values.wso2.deployment.natty.startupProbe.failureThreshold }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: {{ .Values.wso2.deployment.natty.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: {{ .Values.wso2.deployment.natty.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.wso2.deployment.natty.readinessProbe.periodSeconds }}
        resources:
          requests:
            memory: {{ .Values.wso2.deployment.natty.resources.requests.memory }}
            cpu: {{ .Values.wso2.deployment.natty.resources.requests.cpu }}
          limits:
            memory: {{ .Values.wso2.deployment.natty.resources.limits.memory }}
            cpu: {{ .Values.wso2.deployment.natty.resources.limits.cpu }}
      serviceAccountName: {{ .Values.kubernetes.serviceAccount }}
